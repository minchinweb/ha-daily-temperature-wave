name: Validate (HACS and hassfest)

# the cron job is helpful to know if upcoming changes in Home Assistant will
# break something

on:
  push:
  pull_request:
  # schedule:
  #  - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # Brand images (home-assistant/brands) are only needed to be listed
          # in the HACS default store, not to install as a custom repository.
          ignore: "brands"

  validate-hassfest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
