name: Test

# Separate from the lint run (check.yml). Does nothing if the project has no
# tests.

on:
  push:
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.find.outputs.found }}
    steps:
      - uses: actions/checkout@v7
      - id: find
        run: |
          if [ -n "$(git ls-files -- '*/tests/*.py' 'tests/*.py' '*/test_*.py' 'test_*.py' '*_test.py')" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No tests found; skipping."
          fi

  test:
    needs: detect
    if: needs.detect.outputs.found == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Home Assistant supports one Python at a time: match `requires-python`
        # and the release pinned by pytest-homeassistant-custom-component.
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run invoke test
